<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1a2b">
  <title>Knitting Records™ — Painel do Artista</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="knitting.png">
  <link rel="apple-touch-icon" href="knitting.png">
  <!-- Google Fonts: Jost -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ---------- RESET E VARIÁVEIS ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul-escuro: #0a1a2b;
      --azul-medio: #1e3a5f;
      --azul-claro: #e8f0fe;
      --branco: #ffffff;
      --cinza-claro: #f4f7fc;
      --sombra-suave: 0 10px 30px rgba(10, 26, 43, 0.08);
      --borda-arredondada: 16px;
      --fonte-principal: 'Jost', sans-serif;
    }

    body {
      font-family: var(--fonte-principal);
      background: var(--branco);
      color: var(--azul-escuro);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- LOGIN ---------- */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(145deg, var(--branco) 0%, var(--azul-claro) 100%);
      padding: 1.5rem;
    }

    .login-card {
      background: var(--branco);
      border-radius: var(--borda-arredondada);
      box-shadow: var(--sombra-suave);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(10, 26, 43, 0.06);
    }

    .login-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 1.25rem;
      border-radius: 20px;
      background: var(--azul-claro);
      padding: 10px;
    }

    .login-card h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .login-card p {
      font-size: 0.95rem;
      color: #4a5f7a;
      margin-bottom: 2rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--azul-medio);
      letter-spacing: 0.02em;
    }

    .input-group input {
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      border: 1.5px solid #d0dcec;
      font-family: var(--fonte-principal);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--branco);
    }

    .input-group input:focus {
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 4px rgba(30, 58, 95, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: var(--azul-escuro);
      color: var(--branco);
      border: none;
      border-radius: 12px;
      font-family: var(--fonte-principal);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background: var(--azul-medio);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .login-error {
      color: #b3261e;
      font-size: 0.85rem;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    /* ---------- PAINEL PRINCIPAL ---------- */
    .painel {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    .painel.ativo {
      display: flex;
    }

    .topbar {
      background: var(--branco);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--azul-claro);
      box-shadow: 0 2px 12px rgba(10, 26, 43, 0.04);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 12px;
      background: var(--azul-claro);
      padding: 6px;
    }

    .topbar-title {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-title span {
      font-weight: 300;
      color: #4a5f7a;
      font-size: 0.85rem;
      display: block;
      letter-spacing: 0.02em;
    }

    .btn-logout {
      background: transparent;
      border: 1.5px solid #d0dcec;
      padding: 0.55rem 1.25rem;
      border-radius: 30px;
      font-family: var(--fonte-principal);
      font-weight: 500;
      color: var(--azul-escuro);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.9rem;
    }

    .btn-logout:hover {
      background: var(--azul-claro);
      border-color: var(--azul-medio);
    }

    .conteudo {
      flex: 1;
      padding: 2rem 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ---------- CABEÇALHO DO ARTISTA ---------- */
    .artista-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      background: var(--branco);
      border-radius: var(--borda-arredondada);
      padding: 2rem;
      box-shadow: var(--sombra-suave);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      border: 1px solid rgba(10, 26, 43, 0.04);
    }

    .avatar-artista {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--azul-claro);
      background: var(--azul-claro);
      flex-shrink: 0;
    }

    .artista-info {
      flex: 1;
      min-width: 200px;
    }

    .artista-info h2 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .artista-info .bio {
      color: #4a5f7a;
      font-size: 0.95rem;
      margin-top: 0.4rem;
      max-width: 600px;
    }

    .badge-banda {
      display: inline-block;
      background: var(--azul-claro);
      color: var(--azul-medio);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.85rem;
      border-radius: 30px;
      margin-top: 0.6rem;
      text-transform: uppercase;
    }

    .bio-foto-wrapper {
      flex-shrink: 0;
    }

    .bio-foto {
      width: 200px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: var(--sombra-suave);
      background: var(--azul-claro);
    }

    /* ---------- ESTATÍSTICAS ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--branco);
      border-radius: var(--borda-arredondada);
      padding: 1.5rem;
      box-shadow: var(--sombra-suave);
      border: 1px solid rgba(10, 26, 43, 0.04);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #4a5f7a;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--azul-escuro);
      line-height: 1.1;
    }

    .stat-value small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #6b7f99;
      letter-spacing: 0;
    }

    /* ---------- SEÇÃO DE RELEASES ---------- */
    .section-title {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--azul-claro);
      border-radius: 2px;
    }

    .releases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .release-card {
      background: var(--branco);
      border-radius: var(--borda-arredondada);
      overflow: hidden;
      box-shadow: var(--sombra-suave);
      border: 1px solid rgba(10, 26, 43, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .release-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(10, 26, 43, 0.12);
    }

    .release-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: var(--azul-claro);
      display: block;
    }

    .release-info {
      padding: 1rem 1.1rem 1.2rem;
    }

    .release-title {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }

    .release-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
      font-weight: 500;
      color: #4a5f7a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .release-meta span {
      background: var(--azul-claro);
      padding: 0.2rem 0.65rem;
      border-radius: 30px;
    }

    /* ---------- GERENCIAMENTO DE BANDA ---------- */
    .banda-section {
      background: var(--branco);
      border-radius: var(--borda-arredondada);
      padding: 2rem;
      box-shadow: var(--sombra-suave);
      border: 1px solid rgba(10, 26, 43, 0.04);
      margin-bottom: 2.5rem;
    }

    .membros-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .membro-card {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--cinza-claro);
      padding: 0.75rem 1.25rem 0.75rem 0.75rem;
      border-radius: 60px;
      border: 1px solid #e0e8f2;
      transition: background 0.2s;
    }

    .membro-card:hover {
      background: var(--azul-claro);
    }

    .membro-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--azul-medio);
      color: var(--branco);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .membro-nome {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .membro-funcao {
      font-size: 0.75rem;
      color: #4a5f7a;
      letter-spacing: 0.02em;
    }

    .btn-add-membro {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1.5px dashed #b0c4db;
      color: var(--azul-medio);
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      font-family: var(--fonte-principal);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 1.25rem;
    }

    .btn-add-membro:hover {
      border-color: var(--azul-medio);
      background: var(--azul-claro);
    }

    /* ---------- FOOTER ---------- */
    .footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.75rem;
      color: #8a9eb5;
      letter-spacing: 0.02em;
      border-top: 1px solid var(--azul-claro);
      background: var(--branco);
      margin-top: auto;
    }

    .footer a {
      color: var(--azul-medio);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* ---------- RESPONSIVO ---------- */
    @media (max-width: 700px) {
      .topbar {
        padding: 1rem 1.25rem;
      }
      .conteudo {
        padding: 1.25rem 1.25rem 2rem;
      }
      .artista-header {
        padding: 1.5rem;
        gap: 1.25rem;
      }
      .avatar-artista {
        width: 80px;
        height: 80px;
      }
      .artista-info h2 {
        font-size: 1.5rem;
      }
      .bio-foto-wrapper {
        width: 100%;
      }
      .bio-foto {
        width: 100%;
        height: 140px;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .stat-value {
        font-size: 1.6rem;
      }
      .releases-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 450px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .releases-grid {
        grid-template-columns: 1fr;
      }
      .login-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- ========== TELA DE LOGIN ========== -->
  <div class="login-container" id="loginScreen">
    <div class="login-card">
      <img src="knitting.png" alt="Knitting Records" class="login-logo">
      <h1>Knitting Records™</h1>
      <p>Painel do Artista</p>

      <div class="input-group">
        <label for="senhaInput">Senha especial</label>
        <input type="password" id="senhaInput" placeholder="Digite sua senha" autocomplete="current-password">
      </div>

      <button class="btn-login" id="btnEntrar">Entrar no painel</button>
      <div class="login-error" id="loginError" role="alert"></div>
    </div>
  </div>

  <!-- ========== PAINEL PRINCIPAL ========== -->
  <div class="painel" id="painelPrincipal">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <img src="knitting.png" alt="Knitting Records" class="topbar-logo">
        <div class="topbar-title">
          Knitting Records™
          <span>Painel do Artista</span>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </header>

    <!-- Conteúdo -->
    <main class="conteudo" id="conteudoPainel">
      <!-- Renderizado via JS -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      Knitting Records™ — Painel do Artista · Créditos de desenvolvimento: 
      <a href="#" aria-label="DeepSeek">DeepSeek</a>
    </footer>
  </div>

  <!-- ========== SCRIPT ========== -->
  <script>
    (function() {
      'use strict';

      // ============================================================
      // DADOS: CONTAS (ARRAY EDITÁVEL)
      // ============================================================
      const contas = [
        {
          id: 'ricardo',
          nome: 'Ricardo',
          senha: 'oreiade_baterbolo332',
          isBanda: false,
          fotoPerfil: 'sol.jpeg',
          biografia: 'Cada ideia louca de música.',
          fotoBiografia: 'ricardola.jpeg',
          ouvintesMensais: 15,
          streamsTotal: 383,
          dinheiroGerado: 0.0, // em reais
          artista: 'Ricardo',
          artistasBanda: [], // não é banda
          releases: [
            {
              titulo: 'Não Peido Mais Molhado',
              genero: 'Baile Funk',
              tipo: 'Single',
              capa: 'peido.jpeg'
            }
          ]
        },
        {
          id: 'davi',
          nome: 'Daví Luiz',
          senha: 'daviluiz_220116',
          isBanda: false,
          fotoPerfil: 'knitting.png',
          biografia: 'Prestes a se tornar um novo artista',
          fotoBiografia: 'knitting.png',
          ouvintesMensais: 0,
          streamsTotal: 0,
          dinheiroGerado: 0.0,
          artista: 'Daví Luiz',
          artistasBanda: [],
          releases: [ // Não tem bosta nenhuma aqui ainda
          ]
        },
        {
          id: 'horizonte',
          nome: 'Banda Horizonte',
          senha: 'banda teste',
          isBanda: true,
          fotoPerfil: 'https://ui-avatars.com/api/?name=Banda+Horizonte&background=1e3a5f&color=fff&size=200&font-size=0.4',
          biografia: 'Banda de rock alternativo formada em 2020. Energia crua, letras viscerais e uma parede de guitarras.',
          fotoBiografia: 'https://images.unsplash.com/photo-1501612780327-45045538702b?w=600&h=400&fit=crop',
          ouvintesMensais: 27340,
          streamsTotal: 891250,
          dinheiroGerado: 28950.80,
          artista: 'Banda Horizonte',
          artistasBanda: [
            { nome: 'Lucas Andrade', funcao: 'Vocal / Guitarra', avatar: 'LA' },
            { nome: 'Marina Costa', funcao: 'Baixo', avatar: 'MC' },
            { nome: 'Pedro Rocha', funcao: 'Bateria', avatar: 'PR' },
            { nome: 'Julia Nunes', funcao: 'Guitarra / Backing', avatar: 'JN' }
          ],
          releases: [
            {
              titulo: 'Fresta de Luz',
              genero: 'Rock Alternativo',
              tipo: 'Álbum',
              capa: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&h=400&fit=crop'
            }
          ]
        }
      ];

      // ============================================================
      // ESTADO
      // ============================================================
      let contaAtual = null;

      // Elementos
      const loginScreen = document.getElementById('loginScreen');
      const painelPrincipal = document.getElementById('painelPrincipal');
      const senhaInput = document.getElementById('senhaInput');
      const btnEntrar = document.getElementById('btnEntrar');
      const loginError = document.getElementById('loginError');
      const btnLogout = document.getElementById('btnLogout');
      const conteudoPainel = document.getElementById('conteudoPainel');

      // ============================================================
      // FUNÇÕES UTILITÁRIAS
      // ============================================================
      function formatarNumero(n) {
        return n.toLocaleString('pt-BR');
      }

      function formatarDinheiro(v) {
        return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      function iniciais(nome) {
        const partes = nome.trim().split(' ');
        if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
        return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
      }

      // ============================================================
      // LOGIN
      // ============================================================
      function tentarLogin() {
        const senha = senhaInput.value.trim();
        loginError.textContent = '';

        if (!senha) {
          loginError.textContent = 'Digite uma senha.';
          return;
        }

        const conta = contas.find(c => c.senha === senha);

        if (!conta) {
          loginError.textContent = 'Senha incorreta. Tente novamente.';
          senhaInput.value = '';
          senhaInput.focus();
          return;
        }

        // Sucesso
        contaAtual = conta;
        loginScreen.style.display = 'none';
        painelPrincipal.classList.add('ativo');
        renderizarPainel();
        senhaInput.value = '';
      }

      function logout() {
        contaAtual = null;
        painelPrincipal.classList.remove('ativo');
        loginScreen.style.display = 'flex';
        conteudoPainel.innerHTML = '';
        senhaInput.value = '';
        loginError.textContent = '';
        senhaInput.focus();
      }

      // ============================================================
      // RENDERIZAÇÃO DO PAINEL
      // ============================================================
      function renderizarPainel() {
        if (!contaAtual) return;

        const c = contaAtual;

        // --- Cabeçalho do artista ---
        const headerHTML = `
          <div class="artista-header">
            <img src="${c.fotoPerfil}" alt="Foto de perfil de ${c.nome}" class="avatar-artista" loading="eager">
            <div class="artista-info">
              <h2>${c.artista}</h2>
              <p class="bio">${c.biografia}</p>
              ${c.isBanda ? '<span class="badge-banda">Banda</span>' : ''}
            </div>
            <div class="bio-foto-wrapper">
              <img src="${c.fotoBiografia}" alt="Foto de biografia de ${c.nome}" class="bio-foto" loading="lazy">
            </div>
          </div>
        `;

        // --- Estatísticas ---
        const statsHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Ouvintes mensais</div>
              <div class="stat-value">${formatarNumero(c.ouvintesMensais)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Streams no total</div>
              <div class="stat-value">${formatarNumero(c.streamsTotal)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Dinheiro gerado</div>
              <div class="stat-value">${formatarDinheiro(c.dinheiroGerado)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Artista</div>
              <div class="stat-value" style="font-size:1.4rem;">${c.artista}</div>
            </div>
          </div>
        `;

        // --- Releases ---
        let releasesHTML = '';
        if (c.releases && c.releases.length > 0) {
          const cards = c.releases.map(r => `
            <div class="release-card">
              <img src="${r.capa}" alt="Capa do release ${r.titulo}" class="release-cover" loading="lazy">
              <div class="release-info">
                <div class="release-title">${r.titulo}</div>
                <div class="release-meta">
                  <span>${r.genero}</span>
                  <span>${r.tipo}</span>
                </div>
              </div>
            </div>
          `).join('');
          releasesHTML = `
            <h3 class="section-title">Lançamentos</h3>
            <div class="releases-grid">${cards}</div>
          `;
        } else {
          releasesHTML = `
            <h3 class="section-title">Lançamentos</h3>
            <p style="color:#6b7f99; font-size:0.95rem;">Nenhum release cadastrado ainda.</p>
          `;
        }

        // --- Seção de banda (apenas se for banda) ---
        let bandaHTML = '';
        if (c.isBanda && c.artistasBanda && c.artistasBanda.length > 0) {
          const membros = c.artistasBanda.map(m => `
            <div class="membro-card">
              <div class="membro-avatar" style="background:${corAleatoria(m.avatar)};">${m.avatar}</div>
              <div>
                <div class="membro-nome">${m.nome}</div>
                <div class="membro-funcao">${m.funcao}</div>
              </div>
            </div>
          `).join('');

          bandaHTML = `
            <div class="banda-section">
              <h3 class="section-title" style="margin-bottom:0.5rem;">Artistas da banda</h3>
              <p style="color:#4a5f7a; font-size:0.9rem; margin-bottom:0.25rem;">Membros gerenciáveis da banda ${c.artista}</p>
              <div class="membros-lista">${membros}</div>
              <button class="btn-add-membro" type="button" aria-label="Adicionar membro (exemplo visual)">
                <span style="font-size:1.2rem; line-height:1;">+</span> Adicionar membro
              </button>
            </div>
          `;
        } else if (c.isBanda) {
          bandaHTML = `
            <div class="banda-section">
              <h3 class="section-title" style="margin-bottom:0.5rem;">Artistas da banda</h3>
              <p style="color:#6b7f99; font-size:0.95rem;">Nenhum membro cadastrado ainda.</p>
              <button class="btn-add-membro" type="button" aria-label="Adicionar membro (exemplo visual)">
                <span style="font-size:1.2rem; line-height:1;">+</span> Adicionar membro
              </button>
            </div>
          `;
        }

        // Montar tudo
        conteudoPainel.innerHTML = headerHTML + statsHTML + releasesHTML + bandaHTML;
      }

      // Cores fixas para avatares de membros (baseado no texto)
      function corAleatoria(seed) {
        const cores = ['#1e3a5f', '#2d5a87', '#0a1a2b', '#3a6ea5', '#1a4971', '#2b4c6f'];
        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
          hash = seed.charCodeAt(i) + ((hash << 5) - hash);
        }
        return cores[Math.abs(hash) % cores.length];
      }

      // ============================================================
      // EVENTOS
      // ============================================================
      btnEntrar.addEventListener('click', tentarLogin);

      senhaInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          tentarLogin();
        }
      });

      btnLogout.addEventListener('click', logout);

      // Foco inicial no campo de senha (quando a página carrega)
      window.addEventListener('DOMContentLoaded', function() {
        senhaInput.focus();
      });

    })();
  </script>
</body>
</html>
